<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Collection</title>
  <link rel="icon" type="image/x-icon" href="/public/images/logo-title.png" />
  <link rel="stylesheet" href="/public/style.css" />
</head>

<body>

  <!-- Top Banner -->


  <!-- Header Nav -->
  <header class="site-header">
    <a href="/" class="logo">
      <img src="/public/images/logo.png" alt="MyApp Logo" class="logo-img" />

    </a>
    <nav class="nav-menu">
      <a href="/">Início</a>
      <a href="/login">Login</a>
    </nav>

    <div></div>


  </header>
  <div class="container">
    <h1>Redefinir Password</h1>

    <!-- reset-password.html -->
    <form id="resetForm">
      <input type="password" id="newPassword" placeholder="Nova Password" required />
      <input type="password" id="confirmPassword" placeholder="Confirmar Password" required>

      <button type="submit" id="resetButton">Redefinir</button>
    </form>
  </div>
  <div id="customAlertModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:10000;">
    <div
      style="background:#fff; padding:20px; border-radius:10px; max-width:300px; margin:15% auto; text-align:center; box-shadow:0 0 10px rgba(0,0,0,0.3);">
      <p id="customAlertMessage" style="margin-bottom:20px;"></p>
      <button onclick="closeCustomAlert()"
        style="padding:10px 20px; background:#007BFF; color:#fff; border:none; border-radius:5px; cursor:pointer;">OK</button>
    </div>
  </div>
  <script src="/js/utils.js"></script>

  <script>
    const token = window.location.pathname.split('/').pop();

    async function validateToken() {
      const res = await fetch(`/reset-password/${token}/validate`);
      if (!res.ok) {
        document.querySelector('.container').innerHTML = `
          <h1>LINK INVALID !!!</h1>
          <p style="color: red; text-align: center;">This reset link is invalid or has expired. Please request a new one.</p>
        `;
      }
    }

    validateToken();

    document.getElementById('resetForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newPassword = document.getElementById('newPassword').value;
      const confirmPassword = document.getElementById('confirmPassword').value;
      const resetButton = document.getElementById('resetButton');

      if (newPassword.length < 6) {
        await customAlert('A password deve conter pelo menos 6 caracteres.');

        return;
      }

      if (newPassword !== confirmPassword) {
        await customAlert('Passwords não são iguais');

        return;
      }
      resetButton.disable = true;
      const res = await fetch('/reset-password/' + token, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ newPassword }),
      });

      const message = await res.text();

      if (res.status === 410) {
        await customAlert('Este reset link espirou. Porfavor tento um novo.');

        window.location.href = '/forgot-password';
        return;
      }

      if (!res.ok) {
        await customAlert(message);

        return;
      }

      await customAlert(message);


      resetButton.disable = false;
      window.location.href = '/login';
    });
    let alertResolve = null;

    function customAlert(message) {
      return new Promise((resolve) => {
        alertResolve = resolve;
        const modal = document.getElementById("customAlertModal");
        const msgBox = document.getElementById("customAlertMessage");
        msgBox.textContent = message;
        modal.style.display = "block";
      });
    }

    function closeCustomAlert() {
      const modal = document.getElementById("customAlertModal");
      modal.style.display = "none";

      if (typeof alertResolve === 'function') {
        alertResolve(); // this resumes the "await customAlert()"
        alertResolve = null;
      }
    }


  </script>


</body>

</html>

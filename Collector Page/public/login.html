<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login</title>
  <link rel="stylesheet" href="/public/style.css" />
</head>

<body>

  <!-- Top Banner -->


  <!-- Header Nav -->
  <header class="site-header">
    <a href="/" class="logo">
      <img src="/public/images/logo.png" alt="MyApp Logo" class="logo-img" />
    </a>
    <nav class="nav-menu">
      <a href="/">Início</a>
    </nav>

    <nav class="nav-menu">
      <button onclick="location.href='/login'" id="loginBtn" style="display: flex;">Login</button>
    </nav>


  </header>

  <!-- Login Form -->
  <div class="login-form">
    <h1>Login</h1>
    <form id="loginForm">
      <div class="user-container">
        <input type="text" id="username" placeholder="Username" required />
      </div>
      <div class="password-container">
        <input type="password" id="password" placeholder="Password" required />
        <span id="togglePassword" class="toggle-password">☐</span> <!-- Eye icon -->
      </div>
      <button type="submit">Login</button>
    </form>
    <p>Ainda não tem um conta? <a href="/register" class="btn-user-page">Registar aqui</a></p>
    <p><a href="/forgot-password" class="btn-user-page">Esqueceu se da password?</a></p>

  </div>

  <!-- Reusable Modal Component -->
  <div id="customAlertModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:10000;">
    <div
      style="background:#fff; padding:20px; border-radius:10px; max-width:300px; margin:15% auto; text-align:center; box-shadow:0 0 10px rgba(0,0,0,0.3);">
      <p id="customAlertMessage" style="margin-bottom:20px;"></p>
      <button onclick="closeCustomAlert()"
        style="padding:10px 20px; background:#007BFF; color:#fff; border:none; border-radius:5px; cursor:pointer;">OK</button>
    </div>
  </div>
  <script src="public/js/utils.js"></script>
  <script>
    async function login(event) {
      event.preventDefault();
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      const response = await fetch('/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      });

      if (response.ok) {
        window.location.href = '/';
      } else {
        await customAlert('Falha no login!');

      }
    }

    const togglePassword = document.getElementById('togglePassword');
    const passwordInput = document.getElementById('password');

    togglePassword.addEventListener('click', () => {
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      togglePassword.textContent = type === 'password' ? '☐' : '☑'; // Optional: swap icons
    });

    document.getElementById('loginForm').addEventListener('submit', login);

    let alertResolve = null;

    function customAlert(message) {
      return new Promise((resolve) => {
        alertResolve = resolve;
        const modal = document.getElementById("customAlertModal");
        const msgBox = document.getElementById("customAlertMessage");
        msgBox.textContent = message;
        modal.style.display = "block";
      });
    }

    function closeCustomAlert() {
      const modal = document.getElementById("customAlertModal");
      modal.style.display = "none";

      if (typeof alertResolve === 'function') {
        alertResolve(); // this resumes the "await customAlert()"
        alertResolve = null;
      }
    }

  </script>

</body>

</html>

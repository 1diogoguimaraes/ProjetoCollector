<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Collection</title>
  <link rel="icon" type="image/x-icon" href="/public/images/logo-title.png" />
  <link rel="stylesheet" href="/public/style.css" />
</head>

<body>
  <!-- Top Banner -->

  <!-- Header Nav -->
  <header class="site-header">
    <a href="/" class="logo">
      <img src="/public/images/logo.png" alt="MyApp Logo" class="logo-img" />
    </a>
    <nav class="nav-menu">
      <a href="/">Início</a>
      <a href="/login">Login</a>
    </nav>

    <div></div>
  </header>
  <div class="container">
    <h1>Recuperar Password</h1>
    <form id="forgotPasswordForm">
      <input type="text" id="usernameOrEmail" placeholder="Enter your username or email" required />
      <button type="submit" id="sendLinkResetButton">Enviar Reset Link</button>
    </form>
    <div id="checkEmail" style="display: none; text-align: center">
      <p>Verifique o seu email</p>
    </div>
  </div>
  <div id="customAlertModal"
    style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:10000;">
    <div
      style="background:#fff; padding:20px; border-radius:10px; max-width:300px; margin:15% auto; text-align:center; box-shadow:0 0 10px rgba(0,0,0,0.3);">
      <p id="customAlertMessage" style="margin-bottom:20px;"></p>
      <button onclick="closeCustomAlert()"
        style="padding:10px 20px; background:#007BFF; color:#fff; border:none; border-radius:5px; cursor:pointer;">OK</button>
    </div>
    <script src="public/js/utils.js"></script>

    <script>


      document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", async (e) => {
          e.preventDefault();
          const value = document.getElementById("usernameOrEmail").value;

          const res = await fetch("/forgot-password", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ value }),
          });

          const msg = await res.text();
          await customAlert(msg);

          document.getElementById("checkEmail").style.display = "block";
          document.getElementById("forgotPasswordForm").style.display = "none";
          document.getElementById("usernameOrEmail").style.display = "none";
        });
      let alertResolve = null;

      function customAlert(message) {
        return new Promise((resolve) => {
          alertResolve = resolve;
          const modal = document.getElementById("customAlertModal");
          const msgBox = document.getElementById("customAlertMessage");
          msgBox.textContent = message;
          modal.style.display = "block";
        });
      }

      function closeCustomAlert() {
        const modal = document.getElementById("customAlertModal");
        modal.style.display = "none";

        if (typeof alertResolve === 'function') {
          alertResolve(); // this resumes the "await customAlert()"
          alertResolve = null;
        }
      }
    </script>
</body>

</html>
